version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: snake-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snakegame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-snake_showdown}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snakegame} -d ${POSTGRES_DB:-snake_showdown}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snake-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snake-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-snakegame}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-snake_showdown}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snake-network
    restart: unless-stopped

  # Nginx Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
    container_name: snake-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - snake-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  snake-network:
    driver: bridge
